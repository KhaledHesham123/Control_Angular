<section class="login-page" dir="rtl" lang="ar">
  <div class="card">
    <header>
      <span class="mark">
        <img src="falcon-shipping.png" alt="Falcon Shipping" />
      </span>
      <div>
        <p class="eyebrow">Falcon Shipping</p>
        <h1>Login</h1>
      </div>
    </header>

    <p class="lede">سجّل الدخول للوصول إلى Control Center.</p>

    @if (error()) {
      <div class="banner" role="alert">{{ error() }}</div>
    }

    <form (ngSubmit)="submit()">
      <label>
        <span>Email</span>
        <input
          class="ltr"
          name="email"
          type="email"
          autocomplete="username"
          [(ngModel)]="email"
          [disabled]="loading()"
          required
        />
      </label>

      <label>
        <span>Password</span>
        <input
          class="ltr"
          name="password"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          [disabled]="loading()"
          required
        />
      </label>

      <label class="remember">
        <input
          name="rememberMe"
          type="checkbox"
          [(ngModel)]="rememberMe"
          [disabled]="loading()"
        />
        <span>Remember Me</span>
      </label>

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'جاري الدخول...' : 'Login' }}
      </button>
    </form>
  </div>
</section>
