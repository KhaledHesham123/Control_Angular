<div class="shell" [class.mobile-open]="mobileOpen">
  <aside class="sidebar" aria-label="القائمة الرئيسية">
    <div class="side-brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="28" height="28">
          <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M24 8v32M10 28h28M14 28c2 7 6 10 10 10s8-3 10-10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <circle cx="24" cy="16" r="3" fill="currentColor" />
        </svg>
      </span>
      <div>
        <p class="eyebrow">Ships Control</p>
        <h1>القائمة</h1>
      </div>
    </div>

    <nav class="side-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobile()">
        Vessels
      </a>
      <a routerLink="/analysis" routerLinkActive="active" (click)="closeMobile()">Analysis</a>
      <a routerLink="/recommended-analysis" routerLinkActive="active" (click)="closeMobile()">Recommended Analysis</a>
      <a routerLink="/home" routerLinkActive="active" (click)="closeMobile()">Control Center</a>
      <a routerLink="/quotations" routerLinkActive="active" (click)="closeMobile()">Quotations</a>
      <a routerLink="/rfq" routerLinkActive="active" (click)="closeMobile()">RFQ</a>
    </nav>

    <div class="side-user">
      <div>
        <strong>{{ displayName() }}</strong>
        <p>{{ session()?.email }}</p>
        @if (vesselName()) {
          <p class="vessel">Vessel: {{ vesselName() }}</p>
        }
      </div>
      <button type="button" class="logout" (click)="logout()">Logout</button>
    </div>
  </aside>

  @if (mobileOpen) {
    <button type="button" class="backdrop" aria-label="إغلاق القائمة" (click)="closeMobile()"></button>
  }

  <div class="main">
    <header class="topbar">
      <button type="button" class="menu-btn" (click)="toggleMobile()" aria-label="فتح القائمة">☰</button>
      <p>Ships Control</p>
    </header>
    <div class="content">
      <router-outlet />
    </div>
  </div>
</div>
