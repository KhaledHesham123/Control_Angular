<section class="home" dir="ltr" lang="en">
  <header class="mast">
    <div>
      <p class="eyebrow">Falcon Shipping</p>
      <h1>Control Center</h1>
      <p class="lede">Choose a module to get started.</p>
    </div>
    <img class="mast-art brand-lockup" src="falcon-shipping.png" alt="" />
  </header>

  <div class="modules">
    @for (item of modules; track item.route) {
      <button type="button" class="module" (click)="open(item.route)">
        <span class="icon" aria-hidden="true">
          @switch (item.route) {
            @case ('/products') {
              <svg viewBox="0 0 24 24"><path d="M12 3 4 7v10l8 4 8-4V7z" /><path d="m4 7 8 4 8-4M12 11v10" /></svg>
            }
            @case ('/categories') {
              <svg viewBox="0 0 24 24"><path d="M4 5h7v6H4zM13 5h7v6h-7zM4 13h7v6H4z" /><circle cx="16.5" cy="16" r="3.5" /></svg>
            }
            @case ('/vessels') {
              <svg viewBox="0 0 24 24"><path d="M3 17h18l-2.5 4h-13z" /><path d="M6 17V9h12v8M12 9V3M9 6h6" /></svg>
            }
            @default {
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="m15.5 8.5-2 5-5 2 2-5z" /></svg>
            }
          }
        </span>
        <h2 dir="auto">{{ item.title }}</h2>
        <p dir="auto">{{ item.description }}</p>
        <span class="go">
          Open
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </span>
      </button>
    }
  </div>
</section>
